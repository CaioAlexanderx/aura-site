name: Promessas do site

# Falha se o site publicado voltar a prometer TEF, multi-gateway, lotes/validade
# ou balanço de estoque (scripts/tests/promessas-sem-lastro.test.js).
on:
  push:
  pull_request:

jobs:
  promessas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/tests/promessas-sem-lastro.test.js
